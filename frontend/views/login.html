<div class="container mt-5 d-flex justify-content-center">
    <div class="bg-light p-5 rounded shadow-sm" style="max-width: 400px; width: 100%;">
        <h2 class="text-center mb-3 text-pink">Welcome Back</h2>
        <p class="text-center text-muted mb-4">
            Log in to continue your Tracksuit Couture journey and discover the latest in comfort and style.
        </p>

        <form>
            <div class="mb-3">
                <label for="email" class="form-label fw-semibold">Email address</label>
                <input type="email" class="form-control form-control-sm" id="email" placeholder="Enter your email">
            </div>

            <div class="mb-3">
                <label for="password" class="form-label fw-semibold">Password</label>
                <input type="password" class="form-control form-control-sm" id="password" placeholder="Enter your password">
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                    <input type="checkbox" id="rememberMe" class="form-check-input">
                    <label for="rememberMe" class="form-check-label small ms-1">Remember me</label>
                </div>
                <a href="#" class="small text-pink text-decoration-none">Forgot password?</a>
            </div>

            <button type="submit" class="btn btn-pink w-100 py-2">Login</button>
        </form>

        <p class="text-center mt-4 small">
            Don’t have an account? 
            <a href="register.html" class="text-pink text-decoration-none">Sign up</a>
        </p>
    </div>
</div>
